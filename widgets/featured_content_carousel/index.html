<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :host {
    display: block;
    font-family: var(--config--main-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
  }

  .carousel-outer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
  }

  .nav-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid var(--config--main-color-brand, #1d4ed8);
    background: #fff;
    color: var(--config--main-color-brand, #1d4ed8);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.18s, color 0.18s;
    padding: 0;
  }

  .nav-btn:hover {
    background: var(--config--main-color-brand, #1d4ed8);
    color: #fff;
  }

  .nav-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .slide-track {
    flex: 1;
    overflow: hidden;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
    background: #fff;
    min-height: 280px;
  }

  .slide {
    display: none;
    flex-direction: row;
    align-items: stretch;
    min-height: 280px;
  }

  .slide.active {
    display: flex;
  }

  .slide-image-wrap {
    width: 46%;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 13px 0 0 13px;
  }

  .slide-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .slide-content {
    flex: 1;
    padding: 36px 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #fff;
  }

  .slide-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--config--main-color-text, #111827);
    line-height: 1.3;
    margin-bottom: 10px;
  }

  .slide-description {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.65;
    margin-bottom: 22px;
  }

  .slide-btn {
    display: inline-block;
    align-self: flex-start;
    padding: 9px 22px;
    border-radius: 999px;
    border: 2px solid var(--config--main-color-brand, #1d4ed8);
    color: var(--config--main-color-brand, #1d4ed8);
    background: transparent;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.18s, color 0.18s;
    font-family: inherit;
  }

  .slide-btn:hover {
    background: var(--config--main-color-brand, #1d4ed8);
    color: #fff;
  }

  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 2px solid var(--config--main-color-brand, #1d4ed8);
    background: transparent;
    cursor: pointer;
    padding: 0;
    transition: background 0.18s;
  }

  .dot.active {
    background: var(--config--main-color-brand, #1d4ed8);
  }
</style>

<div class="carousel-outer">
  <button class="nav-btn prev-btn" aria-label="Previous slide">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="slide-track" id="slide-track"></div>
  <button class="nav-btn next-btn" aria-label="Next slide">
    <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
  </button>
</div>
<div class="dots" id="dots"></div>

<script type="module" src="app.js"></script>
