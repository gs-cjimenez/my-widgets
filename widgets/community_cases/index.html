<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .w {
    font-family: var(--config--main-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
    font-size: 14px;
    color: var(--config--main-color-text, #111827);
    background: var(--config--main-color-background, #fff);
    --accent: #2563eb;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--config--main-color-background, #fff);
  }
  .topbar h2 { font-size: 18px; font-weight: 700; }
  .topbar-btns { display: flex; gap: 8px; }

  /* ── Buttons ── */
  .btn {
    padding: 7px 14px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid #d1d5db;
    background: #fff;
    color: #374151;
    transition: background 0.15s;
  }
  .btn:hover { background: #f9fafb; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #1d4ed8; }

  /* ── Two-panel body ── */
  .body {
    display: grid;
    grid-template-columns: 3fr 2fr;
    border-top: 1px solid #e5e7eb;
  }

  /* ── Panel ── */
  .panel { border-right: 1px solid #e5e7eb; overflow: hidden; }
  .panel:last-child { border-right: none; }
  .panel-head {
    padding: 10px 16px;
    font-weight: 600;
    font-size: 13px;
    border-bottom: 1px solid #e5e7eb;
    background: #fafafa;
  }

  /* ── Cases table ── */
  .cases-meta {
    padding: 8px 16px;
    font-size: 12px;
    color: #2563eb;
    border-bottom: 1px solid #e5e7eb;
  }
  .cases-meta.hidden { display: none; }

  .cases-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .cases-table th {
    text-align: left;
    padding: 8px 12px;
    font-weight: 600;
    font-size: 12px;
    color: #6b7280;
    background: #f9fafb;
    border-bottom: 1px solid #e5e7eb;
  }
  .cases-table td {
    padding: 9px 12px;
    border-bottom: 1px solid #f3f4f6;
    vertical-align: middle;
  }
  .cases-table tr:last-child td { border-bottom: none; }
  .cases-table tbody tr { cursor: pointer; }
  .cases-table tbody tr:hover td { background: #f9fafb; }
  .cases-table tbody tr.selected td { background: #eff6ff; }

  .subj-cell { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

  /* ── Badges ── */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-new      { background: #dcfce7; color: #166534; }
  .badge-open     { background: #dcfce7; color: #166534; }
  .badge-closed   { background: #f3f4f6; color: #374151; }
  .badge-progress { background: #dbeafe; color: #1e40af; }
  .badge-high     { background: #fee2e2; color: #991b1b; }
  .badge-critical { background: #7f1d1d; color: #fff; }
  .badge-medium   { background: #fef3c7; color: #92400e; }
  .badge-low      { background: #f3f4f6; color: #374151; }

  /* ── Skeleton ── */
  .skel-wrap { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .skel { border-radius: 4px; height: 32px; background: linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%); background-size: 200% 100%; animation: sh 1.4s infinite; }
  .skel.tall { height: 48px; }
  @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ── Error / empty ── */
  .notice { padding: 16px; font-size: 13px; color: #6b7280; }
  .notice.error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; margin: 12px; }

  /* ── Detail panel ── */
  .detail-body { padding: 16px; }
  .detail-empty { padding: 20px 16px; font-size: 13px; color: #9ca3af; }

  .detail-row {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 4px 12px;
    padding: 6px 0;
    border-bottom: 1px solid #f3f4f6;
    font-size: 13px;
    align-items: start;
  }
  .detail-row:last-of-type { border-bottom: none; }
  .detail-label { color: #6b7280; font-weight: 500; }
  .detail-value { color: #111827; }

  .detail-divider { margin: 14px 0 10px; font-weight: 600; font-size: 13px; border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; }

  /* ── Comments ── */
  .comments-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; max-height: 280px; overflow-y: auto; }

  .comment {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 10px 12px;
  }
  .comment-meta { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .comment-author { font-size: 12px; font-weight: 600; color: #374151; }
  .comment-time { font-size: 11px; color: #9ca3af; }
  .comment-body { font-size: 13px; line-height: 1.5; }
  .comment-body p { margin: 0; }

  /* ── Reply box ── */
  .reply-wrap { display: flex; flex-direction: column; gap: 8px; }
  .reply-wrap textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 64px;
    outline: none;
    transition: border-color 0.15s;
    background: #fff;
    color: #111827;
  }
  .reply-wrap textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }

  /* ── Create form (replaces detail panel) ── */
  .create-form { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 12px; font-weight: 600; color: #374151; }
  .form-group input,
  .form-group textarea,
  .form-group select {
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 5px;
    font-size: 13px;
    font-family: inherit;
    color: #111827;
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  .form-group textarea { min-height: 90px; resize: vertical; }
  .form-actions { display: flex; gap: 8px; }

  .hidden { display: none !important; }
</style>

<div class="w">

  <!-- Top bar -->
  <div class="topbar">
    <h2 id="widget-title">My Cases</h2>
    <div class="topbar-btns">
      <button class="btn" id="btn-refresh">Refresh</button>
      <button class="btn btn-primary" id="btn-new-case">+ New Case</button>
    </div>
  </div>

  <!-- Main two-panel area -->
  <div class="body">

    <!-- LEFT: Cases list -->
    <div class="panel">
      <div class="panel-head">Cases</div>
      <div id="cases-meta" class="cases-meta hidden"></div>

      <!-- Loading skeleton -->
      <div id="cases-loading" class="skel-wrap">
        <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      </div>

      <!-- Error -->
      <div id="cases-error" class="notice error hidden"></div>

      <!-- Table -->
      <div id="cases-table-wrap" class="hidden" style="overflow-x:auto;">
        <table class="cases-table">
          <thead>
            <tr>
              <th>Case #</th>
              <th>Subject</th>
              <th>Status</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="cases-tbody"></tbody>
        </table>
      </div>

      <!-- Empty state -->
      <div id="cases-empty" class="notice hidden">
        No cases found. Click <strong>+ New Case</strong> to submit your first case.
      </div>
    </div>

    <!-- RIGHT: Detail / Create -->
    <div class="panel">
      <div class="panel-head" id="right-panel-head">Details</div>

      <!-- Detail: placeholder -->
      <div id="detail-placeholder" class="detail-empty">Select a case to view details.</div>

      <!-- Detail: loading -->
      <div id="detail-loading" class="skel-wrap hidden">
        <div class="skel tall"></div><div class="skel tall"></div><div class="skel"></div>
      </div>

      <!-- Detail: content -->
      <div id="detail-content" class="detail-body hidden">
        <div id="detail-rows"></div>

        <div class="detail-divider">Comments</div>
        <div id="comments-list" class="comments-list"></div>
        <div id="comments-empty" class="notice hidden" style="padding:0 0 12px;">No public comments on this case.</div>

        <div class="reply-wrap">
          <textarea id="reply-text" placeholder="Write a public comment…"></textarea>
          <div>
            <button class="btn btn-primary" id="btn-post-comment">Post Comment</button>
          </div>
        </div>
        <div id="reply-error" class="notice error hidden" style="margin:8px 0 0;"></div>
      </div>

      <!-- Create: form -->
      <div id="create-form" class="create-form hidden">
        <div id="create-error" class="notice error hidden"></div>
        <div class="form-group">
          <label>Subject *</label>
          <input type="text" id="case-subject" placeholder="Brief description of your issue" maxlength="200" />
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea id="case-description" placeholder="Describe your issue in detail…"></textarea>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="case-priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="btn-submit-case">Submit Case</button>
          <button class="btn" id="btn-cancel-create">Cancel</button>
        </div>
      </div>

    </div><!-- /right panel -->
  </div><!-- /body -->

</div><!-- /w -->

<script type="module" src="app.js"></script>
