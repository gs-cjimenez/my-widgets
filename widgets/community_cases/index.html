<style>
  .w-outer, .w-outer *, .w-outer *::before, .w-outer *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .w-outer {
    max-width: 1260px;
    margin: 24px auto;
    padding: 0 20px;
  }

  .w {
    font-family: var(--config-sidebar-widget-font-family, "Intel", sans-serif);
    font-size: 14px;
    line-height: normal;
    color: var(--config--main-color-night, #222222);
    background: var(--config-card-background-color, #fff);
    --accent: var(--config--main-color-brand, #012eff);
    --accent-hover: var(--config-button-cta-hover-background-color, #0027dc);
    --border: var(--config-card-border-color, #ebebeb);
    --muted: var(--config-meta-text-color, #949494);
    --muted-dark: var(--config--main-color-dusk-dark, #616a73);
    --surface: var(--config--main-color-day, #f0f2f6);
    --selected: var(--config-list-views-card-click-border-color, #d8dffe);
    border: 1px solid var(--border);
    border-radius: 5px;
    box-shadow: var(--config-card-hover-shadow, 0 5px 20px 0 rgba(0,0,0,0.08));
    overflow: hidden;
  }

  /* ── Top bar ── */
  .w .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--config-card-background-color, #fff);
  }
  .w .topbar h2 { font-size: 18px; font-weight: 700; line-height: normal; }
  .w .topbar-btns { display: flex; gap: 8px; }

  /* ── Buttons ── */
  .w .btn {
    display: inline-flex;
    align-items: center;
    padding: 7px 16px;
    border-radius: 50px;
    font-size: 13px;
    line-height: normal;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    transition: background 0.15s, color 0.15s;
  }
  .w .btn:hover { background: var(--surface); }
  .w .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .w .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .w .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  /* ── Two-panel body ── */
  .w .body {
    display: grid;
    grid-template-columns: 3fr 2fr;
    border-top: 1px solid var(--border);
  }

  /* ── Panel ── */
  .w .panel { border-right: 1px solid var(--border); overflow: hidden; }
  .w .panel:last-child { border-right: none; }
  .w .panel-head {
    padding: 10px 16px;
    font-weight: 600;
    font-size: 13px;
    line-height: normal;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  /* ── Cases table ── */
  .w .cases-meta {
    padding: 8px 16px;
    font-size: 12px;
    line-height: normal;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
  }
  .w .cases-meta.hidden { display: none; }

  .w .cases-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .w .cases-table th {
    text-align: left;
    padding: 8px 12px;
    font-weight: 600;
    font-size: 12px;
    line-height: normal;
    color: var(--muted-dark);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .w .cases-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    line-height: normal;
  }
  .w .cases-table tr:last-child td { border-bottom: none; }
  .w .cases-table tbody tr { cursor: pointer; }
  .w .cases-table tbody tr:hover td { background: var(--surface); }
  .w .cases-table tbody tr.selected td { background: var(--selected); }

  .w .subj-cell { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

  /* ── Badges ── */
  .w .badge {
    display: inline-block;
    box-sizing: border-box;
    padding: 3px 10px;
    border-radius: 40px;
    font-size: 11px;
    line-height: 1.5;
    font-weight: 600;
    font-family: inherit;
    white-space: nowrap;
    vertical-align: middle;
  }
  .w .badge-new      { background: #3cb54a1a; color: var(--config--main-color-success, #3cb54a); }
  .w .badge-open     { background: #3cb54a1a; color: var(--config--main-color-success, #3cb54a); }
  .w .badge-closed   { background: var(--surface); color: var(--muted-dark); }
  .w .badge-progress { background: #012eff1a; color: var(--accent); }
  .w .badge-high     { background: #ed59371a; color: var(--config--main-color-alert, #ed5937); }
  .w .badge-critical { background: var(--config--main-color-alert, #ed5937); color: #fff; }
  .w .badge-medium   { background: #f793211a; color: var(--config--main-color-info, #f79321); }
  .w .badge-low      { background: var(--surface); color: var(--muted-dark); }

  /* ── Skeleton ── */
  .w .skel-wrap { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .w .skel { border-radius: 4px; height: 32px; background: linear-gradient(90deg,var(--surface) 25%,var(--border) 50%,var(--surface) 75%); background-size: 200% 100%; animation: sh 1.4s infinite; }
  .w .skel.tall { height: 48px; }
  @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ── Error / empty ── */
  .w .notice { padding: 16px; font-size: 13px; line-height: 1.5; color: var(--muted-dark); }
  .w .notice.error { color: var(--config--main-color-alert, #ed5937); background: #ed59370d; border: 1px solid #ed593733; border-radius: 6px; margin: 12px; }

  /* ── Detail panel ── */
  .w .detail-body { padding: 16px; }
  .w .detail-empty { padding: 20px 16px; font-size: 13px; line-height: 1.5; color: var(--muted); }

  .w .detail-row {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 4px 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.5;
    align-items: start;
  }
  .w .detail-row:last-of-type { border-bottom: none; }
  .w .detail-label { color: var(--muted-dark); font-weight: 500; }
  .w .detail-value { color: var(--config--main-color-night, #222222); }

  .w .detail-divider { margin: 14px 0 10px; font-weight: 600; font-size: 13px; line-height: normal; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

  /* ── Comments ── */
  .w .comments-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; max-height: 280px; overflow-y: auto; }

  .w .comment {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 10px 12px;
  }
  .w .comment-meta { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .w .comment-author { font-size: 12px; font-weight: 600; line-height: normal; color: var(--muted-dark); }
  .w .comment-time { font-size: 11px; line-height: normal; color: var(--muted); }
  .w .comment-body { font-size: 13px; line-height: 1.5; }
  .w .comment-body p { margin: 0; }

  /* ── Reply box ── */
  .w .reply-wrap { display: flex; flex-direction: column; gap: 8px; }
  .w .reply-wrap textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.5;
    font-family: inherit;
    resize: vertical;
    min-height: 64px;
    outline: none;
    transition: border-color 0.15s;
    background: #fff;
    color: var(--config--main-color-night, #222222);
  }
  .w .reply-wrap textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(1,46,255,0.12); }

  /* ── Create form (replaces detail panel) ── */
  .w .create-form { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .w .form-group { display: flex; flex-direction: column; gap: 5px; }
  .w .form-group label { font-size: 12px; font-weight: 600; line-height: normal; color: var(--muted-dark); }
  .w .form-group input,
  .w .form-group textarea,
  .w .form-group select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 13px;
    line-height: 1.5;
    font-family: inherit;
    color: var(--config--main-color-night, #222222);
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
  }
  .w .form-group input:focus,
  .w .form-group textarea:focus,
  .w .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(1,46,255,0.12); }
  .w .form-group textarea { min-height: 90px; resize: vertical; }
  .w .form-actions { display: flex; gap: 8px; }

  .w .hidden { display: none !important; }
</style>

<div class="w-outer">
<div class="w">

  <!-- Top bar -->
  <div class="topbar">
    <h2 id="widget-title">My Cases</h2>
    <div class="topbar-btns">
      <button class="btn" id="btn-refresh">Refresh</button>
      <button class="btn btn-primary" id="btn-new-case">+ New Case</button>
    </div>
  </div>

  <!-- Main two-panel area -->
  <div class="body">

    <!-- LEFT: Cases list -->
    <div class="panel">
      <div class="panel-head">Cases</div>
      <div id="cases-meta" class="cases-meta hidden"></div>

      <!-- Loading skeleton -->
      <div id="cases-loading" class="skel-wrap">
        <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      </div>

      <!-- Error -->
      <div id="cases-error" class="notice error hidden"></div>

      <!-- Table -->
      <div id="cases-table-wrap" class="hidden" style="overflow-x:auto;">
        <table class="cases-table">
          <thead>
            <tr>
              <th>Case #</th>
              <th>Subject</th>
              <th>Status</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="cases-tbody"></tbody>
        </table>
      </div>

      <!-- Empty state -->
      <div id="cases-empty" class="notice hidden">
        No cases found. Click <strong>+ New Case</strong> to submit your first case.
      </div>
    </div>

    <!-- RIGHT: Detail / Create -->
    <div class="panel">
      <div class="panel-head" id="right-panel-head">Details</div>

      <!-- Detail: placeholder -->
      <div id="detail-placeholder" class="detail-empty">Select a case to view details.</div>

      <!-- Detail: loading -->
      <div id="detail-loading" class="skel-wrap hidden">
        <div class="skel tall"></div><div class="skel tall"></div><div class="skel"></div>
      </div>

      <!-- Detail: content -->
      <div id="detail-content" class="detail-body hidden">
        <div id="detail-rows"></div>

        <div class="detail-divider">Comments</div>
        <div id="comments-list" class="comments-list"></div>
        <div id="comments-empty" class="notice hidden" style="padding:0 0 12px;">No public comments on this case.</div>

        <div class="reply-wrap">
          <textarea id="reply-text" placeholder="Write a public comment…"></textarea>
          <div>
            <button class="btn btn-primary" id="btn-post-comment">Post Comment</button>
          </div>
        </div>
        <div id="reply-error" class="notice error hidden" style="margin:8px 0 0;"></div>
      </div>

      <!-- Create: form -->
      <div id="create-form" class="create-form hidden">
        <div id="create-error" class="notice error hidden"></div>
        <div class="form-group">
          <label>Subject *</label>
          <input type="text" id="case-subject" placeholder="Brief description of your issue" maxlength="200" />
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea id="case-description" placeholder="Describe your issue in detail…"></textarea>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="case-priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="btn-submit-case">Submit Case</button>
          <button class="btn" id="btn-cancel-create">Cancel</button>
        </div>
      </div>

    </div><!-- /right panel -->
  </div><!-- /body -->

</div><!-- /w -->
</div><!-- /w-outer -->

<script type="module" src="app.js"></script>
